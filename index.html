<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Phong Thủy Thông Dụng</title>
<meta name="description" content="Trang phong thủy thông dụng với các công cụ lịch vạn niên, bản mệnh, huyền không phi tinh, khai môn điểm thần sát và dương trạch tam yếu.">
<link rel="stylesheet" href="./css/index.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <div class="header-icon">☯</div>
        <div>
            <h1>PHONG THỦY ỨNG DỤNG</h1>
            <p>Ứng dụng và tra cứu phong thủy</p>
        </div>
    </div>
</header>

<div class="marquee-wrap">
    <div class="marquee-text">Chào bạn đến với trang phong thủy thông dụng</div>
</div>

<main class="main-container">
    <div class="welcome">
    
    <div class="bagua-wrap">
        <div class="bagua-ring">
            <span>☰</span>
            <span>☱</span>
            <span>☲</span>
            <span>☳</span>
            <span>☷</span>
            <span>☶</span>
            <span>☵</span>
            <span>☴</span>
            <div class="taichi">☯</div>
        </div>
    </div>
</div>

    <section class="tool-grid">
        <button class="tool-card" data-module="lichvannien">
            <span class="tool-icon">📅</span>
            <span class="tool-title">Lịch vạn niên</span>
            <span class="tool-desc">Âm lịch, Can Chi và thông tin ngày</span>
        </button>

        <button class="tool-card" data-module="banmenh">
            <span class="tool-icon">☯</span>
            <span class="tool-title">Thông tin bản mệnh</span>
            <span class="tool-desc">Tra cứu thông tin theo năm sinh</span>
        </button>

        <button class="tool-card" data-module="duongtrachhuyenkhong">
            <span class="tool-icon">🧭</span>
            <span class="tool-title">Dương trạch / Huyền không phi tinh</span>
            <span class="tool-desc">Tra cứu và phân tích không gian</span>
        </button>

        <button class="tool-card" data-module="khaimon">
            <span class="tool-icon">🚪</span>
            <span class="tool-title">Khai môn điểm thần sát</span>
            <span class="tool-desc">Xác định phương vị và thần sát</span>
        </button>

        <button class="tool-card" data-module="duongtrachtamyeu">
            <span class="tool-icon">🏠</span>
            <span class="tool-title">Dương trạch tam yếu</span>
            <span class="tool-desc">Phân tích Môn, Chủ, Táo</span>
        </button>

        <button class="tool-card" data-module="tailieu">
            <span class="tool-icon">📚</span>
            <span class="tool-title">Tài liệu tham khảo</span>
            <span class="tool-desc">Tài liệu và dữ liệu phong thủy</span>
        </button>
    </section>

    <section id="content-area" class="content-area">
        <div class="content-placeholder">
            <div class="placeholder-icon">☯</div>
            <h3>Chọn một ứng dụng ở trên để xem</h3>
            
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="footer-inner">
                <div class="footer-contact">
            <div class="footer-contact-title">Thông tin</div>
            <a href="tel:0982175887" class="footer-contact-item">

            </a>
            <a href="https://www.facebook.com/truongthanh101071" target="_blank" rel="noopener noreferrer" class="footer-contact-item">
                <span>ⓕ</span>
                <span>Facebook</span>
            </a>
        </div>

        <button class="footer-item admin-login" data-footer="admin">
            <span>🔒</span>
        </button>
    </div>

    <div class="copyright">© 2026 Phong Thủy Thông Dụng</div>
</footer>

<script type="module" src="./js/index.js"></script>
</body>
</html>
